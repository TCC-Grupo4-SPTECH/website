<section class="upload-page">
  <div
    class="dropzone"
    [class.dropzone--active]="isDraggingOver()"
    role="button"
    tabindex="0"
    (click)="fileInput.click()"
    (keydown.enter)="fileInput.click()"
    (dragover)="onDragOver($event)"
    (dragleave)="onDragLeave($event)"
    (drop)="onDrop($event)"
  >
    <h1 class="dropzone__title">Envie seu avistamento</h1>
    <p class="dropzone__subtitle">Arraste e solte arquivos aqui, ou clique para selecionar.</p>

    <button class="dropzone__button" type="button" (click)="$event.stopPropagation(); fileInput.click()">
      Selecionar arquivos
    </button>

    <p class="dropzone__hint">Formatos aceitos: JPEG, PNG</p>
  </div>

  <input
    #fileInput
    class="visually-hidden"
    type="file"
    accept="image/jpeg,image/png"
    multiple
    (change)="onFilesSelected($event)"
  />
</section>
